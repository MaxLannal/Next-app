<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1017">
<meta name="robots" content="noindex">
<title>Hub unreachable</title>
<!-- The Dusk page for a hub that can't be reached. Static: its styles are inline so the
     service worker can serve it alone. Tokens match web/src/styles/tokens.css. -->
<style>
  :root {
    --color-paper: oklch(17.5% 0.014 268); --color-ink: oklch(96% 0.006 75); --color-ink-2: oklch(85% 0.010 262);
    --color-muted: oklch(70% 0.016 262); --color-accent: oklch(77% 0.10 274); --color-accent-2: oklch(83% 0.095 62);
    --color-dusk: oklch(70% 0.12 330); --color-fog: oklch(94% 0.012 70);
    --glass: oklch(22% 0.018 268 / 0.58);
    --glass-hi: inset 0 1px 0 oklch(100% 0 0 / 0.10), inset 0 0 0 1px oklch(100% 0 0 / 0.06);
    --shadow-card: 0 1px 0 oklch(100% 0 0 / 0.06) inset, 0 40px 80px -32px oklch(8% 0.02 268 / 0.7);
    --font-display: "Wix Madefor Display", ui-sans-serif, system-ui, sans-serif;
    --font-body: "Wix Madefor Text", ui-sans-serif, system-ui, sans-serif;
    --radius-card: 18px; --radius-pill: 999px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { display: grid; place-items: center; min-height: 100svh; padding: var(--space-xl); background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.55; -webkit-font-smoothing: antialiased; isolation: isolate; }
  .ground { position: fixed; inset: 0; z-index: -1; }
  .ground img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; filter: contrast(1.04) saturate(1.06); }
  .ground::after { content: ""; position: absolute; inset: 0; background:
    radial-gradient(ellipse 60% 60% at 50% 45%, oklch(94% 0.012 70 / 0.55), oklch(94% 0.012 70 / 0.2) 50%, transparent 80%),
    linear-gradient(to bottom, transparent 60%, var(--color-paper) 99%); }
  .card { position: relative; width: min(100%, 460px); padding: var(--space-xl); border-radius: var(--radius-card); background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.35); backdrop-filter: blur(22px) saturate(1.35); box-shadow: var(--glass-hi), var(--shadow-card); }
  .mark { display: inline-flex; align-items: center; gap: 12px; font: 600 1.125rem/1 var(--font-display); letter-spacing: -0.01em; }
  .mark__dot { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--color-accent-2), var(--color-dusk) 55%, var(--color-accent) 100%); box-shadow: 0 0 0 1px oklch(100% 0 0 / 0.18) inset; }
  h1 { margin: var(--space-lg) 0 0; font: 500 2rem/1.05 var(--font-display); letter-spacing: -0.022em; text-wrap: balance; }
  p { margin: var(--space-md) 0 0; max-width: 46ch; color: var(--color-ink-2); }
  .hint { color: var(--color-muted); font-size: 0.9375rem; }
  .reload { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; margin-top: var(--space-lg); padding: 0 var(--space-lg); border: 0; border-radius: var(--radius-pill); background: var(--color-accent); color: oklch(19% 0.035 274); font: 600 0.9375rem/1 var(--font-body); text-decoration: none; cursor: pointer; box-shadow: inset 0 1px 0 oklch(100% 0 0 / 0.35); }
  .reload:hover { filter: brightness(1.05); }
  .reload:focus-visible { outline: 2px solid oklch(80% 0.10 274); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <div class="ground" aria-hidden="true">
    <img src="/photos/fog.jpg" alt="">
  </div>
  <main class="card">
    <span class="mark" aria-hidden="true"><span class="mark__dot"></span>Hub</span>
    <h1>Hub unreachable</h1>
    <p>Your Mac is asleep or offline. Open the lid or plug it in, then reload.</p>
    <p class="hint">This page is saved on your device, so it shows whenever the Mac can’t answer.</p>
    <a class="reload" href="/">Reload</a>
  </main>
</body>
</html>
